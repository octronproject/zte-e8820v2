name: Build OpenWrt Official v21.02.7 - ZTE E8820V2

on:
  workflow_dispatch:

env:
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04

    # Prevent parallel builds
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set Build Date & Timezone
      run: |
        sudo timedatectl set-timezone "Asia/Jakarta"
        echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

    - name: Prepare Ubuntu Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        echo "📦 Preparing build environment..."
        sudo -E apt-get update -qq
        sudo -E apt-get install -y -qq \
          build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev \
          libssl-dev python3 python3-setuptools rsync swig unzip \
          zlib1g-dev file wget ccache time
        sudo -E apt-get autoremove --purge -y > /dev/null 2>&1
        sudo -E apt-get clean
        echo "✓ Build environment ready"

    - name: Validate Custom Files Exist
      run: |
        set -e
        echo "🔍 Validating custom files..."
        [ -f "custom/mt7621_zte_e8820v2.dts" ] || (echo "❌ Missing: custom/mt7621_zte_e8820v2.dts" && exit 1)
        [ -f "custom/mt7621.mk" ] || (echo "❌ Missing: custom/mt7621.mk" && exit 1)
        [ -f "custom/01_leds" ] || (echo "❌ Missing: custom/01_leds" && exit 1)
        [ -f "custom/02_network" ] || (echo "❌ Missing: custom/02_network" && exit 1)
        [ -f ".config" ] || (echo "❌ Missing: .config" && exit 1)
        echo "✓ All custom files found"

    - name: Clone OpenWrt Official v21.02.7
      run: |
        set -e
        echo "📥 Cloning OpenWrt v21.02.7..."
        git clone --depth 1 --branch v21.02.7 https://github.com/openwrt/openwrt.git

    - name: Update and Install Feeds
      run: |
        set -e
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "✓ Feeds updated and installed"

    - name: Copy and overwrite custom files (with backups)
      run: |
        set -e
        echo "📁 Copying custom files into openwrt tree (overwriting targets, backups created)..."
        # Sources in repo
        DTS_SRC="custom/mt7621_zte_e8820v2.dts"
        MK_SRC="custom/mt7621.mk"
        LED_SRC="custom/01_leds"
        NETWORK_SRC="custom/02_network"
        CONFIG_SRC=".config"
        
        # Destinations in openwrt tree (per your paths)
        DTS_DEST="openwrt/target/linux/ramips/dts"
        MK_DEST="openwrt/target/linux/ramips/image"
        LED_DEST="openwrt/target/linux/ramips/mt7621/base-files/etc/board.d"
        NETWORK_DEST="openwrt/target/linux/ramips/mt7621/base-files/etc/board.d"
        CONFIG_DEST="openwrt/.config"

        # Create dest dirs if needed
        mkdir -p "$DTS_DEST" "$MK_DEST" "$LED_DEST" "$NETWORK_DEST" "$(dirname "$CONFIG_DEST")"

        # Backup & copy DTS
        if [ -f "$DTS_DEST/mt7621_zte_e8820v2.dts" ]; then
          cp -a "$DTS_DEST/mt7621_zte_e8820v2.dts" "$DTS_DEST/mt7621_zte_e8820v2.dts.bak-${BUILD_DATE}"
          echo "⚠️ Backed up existing $DTS_DEST/mt7621_zte_e8820v2.dts -> .bak-${BUILD_DATE}"
        fi
        cp -f "$DTS_SRC" "$DTS_DEST/"
        echo "✓ Copied mt7621_zte_e8820v2.dts"

        # Backup & copy mk
        if [ -f "$MK_DEST/mt7621.mk" ]; then
          cp -a "$MK_DEST/mt7621.mk" "$MK_DEST/mt7621.mk.bak-${BUILD_DATE}"
          echo "⚠️ Backed up existing $MK_DEST/mt7621.mk -> .bak-${BUILD_DATE}"
        fi
        cp -f "$MK_SRC" "$MK_DEST/"
        echo "✓ Copied mt7621.mk"

        # Backup & copy led file
        if [ -f "$LED_DEST/01_leds" ]; then
          cp -a "$LED_DEST/01_leds" "$LED_DEST/01_leds.bak-${BUILD_DATE}"
          echo "⚠️ Backed up existing $LED_DEST/01_leds -> .bak-${BUILD_DATE}"
        fi
        cp -f "$LED_SRC" "$LED_DEST/"
        echo "✓ Copied 01_leds"

        # Backup & copy network file
        if [ -f "$NETWORK_DEST/02_network" ]; then
          cp -a "$NETWORK_DEST/02_network" "$NETWORK_DEST/02_network.bak-${BUILD_DATE}"
          echo "⚠️ Backed up existing $NETWORK_DEST/02_network -> .bak-${BUILD_DATE}"
        fi
        cp -f "$NETWORK_SRC" "$NETWORK_DEST/"
        echo "✓ Copied 02_network"

        # Backup & copy .config to openwrt/.config (overwrite)
        if [ -f "$CONFIG_DEST" ]; then
          cp -a "$CONFIG_DEST" "${CONFIG_DEST}.bak-${BUILD_DATE}"
          echo "⚠️ Backed up existing $CONFIG_DEST -> .bak-${BUILD_DATE}"
        fi
        cp -f "$CONFIG_SRC" "$CONFIG_DEST"
        echo "✓ Copied .config"

        # Optional: copy a snapshot of custom into openwrt/custom for traceability (non-destructive)
        mkdir -p openwrt/custom
        cp -a custom/. openwrt/custom/

        echo "✓ All custom files copied and overwritten as requested"
    
    - name: Prepare Build (apply .config)
      run: |
        set -e
        cd openwrt
        if [ ! -f .config ]; then
          echo "❌ openwrt/.config not found" && exit 1
        fi
        # Refresh config
        make defconfig
        echo "✓ defconfig applied"

    - name: Compile OpenWrt
      env:
        JOBS: ${{ runner.cores }}
      run: |
        set -e
        cd openwrt
        JOBS=$(nproc || echo 2)
        echo "Using $JOBS parallel jobs"
        export CCACHE_DIR="$HOME/.ccache"
        mkdir -p "$CCACHE_DIR"
        ccache -M 2G || true
        time make -j"$JOBS" V=s world
        echo "✓ Build finished"

    - name: Package artifacts
      run: |
        set -e
        rm -rf artifacts || true
        mkdir -p artifacts
        if [ -d openwrt/bin ]; then
          cp -a openwrt/bin artifacts/
        else
          echo "⚠️ openwrt/bin not found — build may have failed or produced outputs elsewhere"
        fi
        ls -la artifacts || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-artifacts-${{ env.BUILD_DATE }}
        path: artifacts/**

    - name: Success message
      if: ${{ success() }}
      run: |
        echo "🎉 OpenWrt build completed. Artifacts uploaded as openwrt-artifacts-${BUILD_DATE}."
