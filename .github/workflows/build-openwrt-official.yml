name: Build OpenWrt Official v25.12.5 - ZTE E8820V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repositori Anda
      uses: actions/checkout@v4

    - name: Mempersiapkan Lingkungan Ubuntu
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo docker rmi $(docker image ls -q) 2>/dev/null || true
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y purge azure-cli google-cloud-cli google-chrome-stable firefox powershell dotnet-sdk*
        sudo -E apt-get update
        sudo -E apt-get -y install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget
        sudo -E apt-get autoremove --purge -y
        sudo -E apt-get clean
        
    - name: Clone Source Code OpenWrt Official v25.12.5
      run: |
        git clone https://github.com/openwrt/openwrt.git
        cd openwrt
        git pull
        git checkout v25.12.5

    - name: Setup Cache Toolchain & DL
      uses: actions/cache@v4
      with:
        path: |
          openwrt/staging_dir/host
          openwrt/staging_dir/toolchain-*
          openwrt/dl
        key: ${{ runner.os }}-openwrt-official-v25.12.5-${{ hashFiles('openwrt/feeds.conf.default') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-official-v25.12.5-
          
    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: Eksekusi Metode Menimpa File Langsung (OpenWrt Official)
      run: |
        # 1. Menambahkan/menimpa file DTS baru untuk E8820V2 ke folder dts
        cp -f custom/mt7621_zte_e8820v2.dts openwrt/target/linux/ramips/dts/

        # 2. Menimpa file Makefile (.mk) bawaan asli dengan file .mk kustom Anda (yang sudah ada profil e8820v2)
        cp -f custom/mt7621.mk openwrt/target/linux/ramips/image/

        # 3. Menimpa file LED dan Network bawaan asli dengan versi kustom Anda
        cp -f custom/01_leds openwrt/target/linux/ramips/mt7621/base-files/etc/board.d/

        # 4. Menimpa file konfigurasi .config untuk E8820V2
        if [ -f "../.config" ]; then
          cp -f ../.config .config
          echo "Berhasil menyalin .config kustom!"
        fi
        cd openwrt
        make defconfig

    - name: Unduh Paket Dependensi (Make Download)
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Proses Kompilasi Firmware
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Unggah Hasil Firmware (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_Official_ZTE_E8820V2_v25.12.5
        path: |
          openwrt/bin/targets/ramips/mt7621/*.bin
          openwrt/bin/targets/ramips/mt7621/*.tar*
