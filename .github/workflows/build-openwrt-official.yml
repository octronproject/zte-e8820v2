name: Build OpenWrt Official v25.12.5 - ZTE E8820V2

on:
  workflow_dispatch:
  
env:
    TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04
    
    # Prevent parallel builds
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
      
    - name: Set Build Date & Timezone
      run: |
        sudo timedatectl set-timezone "Asia/Jakarta"
        echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

    - name: Prepare Ubuntu Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        echo "📦 Preparing build environment..."
        
        sudo -E apt-get update -qq
        sudo -E apt-get install -y -qq \
          build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev \
          libssl-dev python3 python3-setuptools rsync swig unzip \
          zlib1g-dev file wget
        
        sudo -E apt-get autoremove --purge -y > /dev/null 2>&1
        sudo -E apt-get clean
        
        echo "✓ Build environment ready"

    - name: Validate Custom Files Exist
      run: |
        set -e
        echo "🔍 Validating custom files..."
        
        [ -f "custom/mt7621_zte_e8820v2.dts" ] || (echo "❌ Missing: custom/mt7621_zte_e8820v2.dts" && exit 1)
        [ -f "custom/mt7621.mk" ] || (echo "❌ Missing: custom/mt7621.mk" && exit 1)
        [ -f "custom/01_leds" ] || (echo "❌ Missing: custom/01_leds" && exit 1)
        [ -f ".config" ] || (echo "❌ Missing: .config" && exit 1)
        
        echo "✓ All custom files found"
        echo "✓ .config found"

    - name: Clone OpenWrt Official v25.12.5
      run: |
        set -e
        echo "📥 Cloning OpenWrt v25.12.5..."
        
        git clone --depth 1 --branch v25.12.5 \
          https://github.com/openwrt/openwrt.git openwrt 2>&](#)

